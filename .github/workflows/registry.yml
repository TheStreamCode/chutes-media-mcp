name: Publish to MCP Registry

# Registry publication is manual: npm must already serve the version that
# server.json points at, and the registry validates that package first.
"on":
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish-registry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o mcp-publisher_linux_amd64.tar.gz "${base}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o checksums.txt "${base}/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          grep -E ' mcp-publisher_linux_amd64\.tar\.gz$' checksums.txt | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
