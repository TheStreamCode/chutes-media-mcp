<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">chutes-media-mcp social preview</title>
  <desc id="description">MCP server and CLI for image, video, music and speech generation.</desc>
  <defs>
